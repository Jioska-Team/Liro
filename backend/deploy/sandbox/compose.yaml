name: liro-sandbox

x-environment: &environment
  DOTNET_ENVIRONMENT: Staging
  ASPNETCORE_ENVIRONMENT: Staging
  ConnectionStrings__lirodb: Host=sandbox-postgres;Port=5432;Database=liro_sandbox;Username=liro_sandbox;Password=${SANDBOX_DB_PASSWORD:?Set sandbox password};Include Error Detail=false
  ConnectionStrings__valkey: sandbox-valkey:6379,abortConnect=false
  Lan__Enabled: "false"

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-dependencies: &dependencies
  sandbox-postgres: { condition: service_healthy }
  sandbox-valkey: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

services:
  sandbox-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: liro_sandbox
      POSTGRES_USER: liro_sandbox
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:?Set sandbox password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U liro_sandbox -d liro_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  sandbox-valkey:
    image: valkey/valkey:8-alpine
    command: [valkey-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [valkey-data:/data]
    networks: [data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  migrate:
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile
      args: { PROJECT: Liro.SandboxMigrator }
    command: [--apply-sandbox]
    environment: *environment
    depends_on:
      sandbox-postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile
      args: { PROJECT: Liro.Api }
    environment:
      <<: *environment
      ASPNETCORE_HTTP_PORTS: "8080"
      HealthChecks__ExposeEndpoints: "true"
      Security__AdminApiKey: ${SANDBOX_ADMIN_API_KEY:?Set sandbox admin key}
    ports: ["127.0.0.1:${SANDBOX_API_PORT:-15205}:8080"]
    networks: [data]
    depends_on: *dependencies
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  catalog:
    profiles: [workers]
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile
      args: { PROJECT: Liro.CatalogWorker }
    environment:
      <<: *environment
      CatalogWorkers__BootstrapEnabled: "false"
      CatalogWorkers__RefreshEnabled: "false"
      CatalogWorkers__DiscoveryEnabled: "false"
      CatalogWorkers__LimitedMonitorEnabled: "false"
      CatalogWorkers__KnownLimitedMonitorEnabled: "false"
      CatalogWorkers__ComplementaryLimitedSearchEnabled: "false"
      Roblox__Requests__BudgetCapacity: "3"
      Roblox__Requests__SearchBudgetCapacity: "1"
    networks: [data]
    depends_on: *dependencies
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  market:
    profiles: [workers]
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile
      args: { PROJECT: Liro.MarketWorker }
    environment:
      <<: *environment
      Market__Enabled: "false"
      Market__RequestsPerMinute: "3"
      Market__MaxConcurrentRequests: "1"
      Market__InstanceLockPath: /var/lib/liro-market/worker.lock
    volumes: [market-state:/var/lib/liro-market]
    networks: [data]
    depends_on: *dependencies
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    logging: *logging

networks:
  data:
    internal: true
volumes:
  postgres-data:
  valkey-data:
  market-state:
